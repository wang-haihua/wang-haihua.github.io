<svg viewBox="0 0 1200 232" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #222; }
    .row-label { font-size: 13px; font-weight: 600; fill: #333; }
    .row-sub { font-size: 11px; fill: #666; }
    .seg-label { font-size: 11px; fill: #333; }
    .seg-in { font-size: 10.5px; fill: #234; }
    .seg-hi { font-size: 11px; fill: #8b4513; font-weight: 600; }
    .summary { font-size: 12px; font-weight: 600; fill: #333; }
    .conclusion { font-size: 12px; fill: #333; }
  </style>

  <rect x="0" y="0" width="1200" height="232" fill="#ffffff"/>

  <text x="600" y="26" text-anchor="middle" class="title">同一个 200K 窗口：精简与臃肿两种装法</text>

  <!-- legend -->
  <g transform="translate(300, 44)">
    <rect x="0" y="0" width="14" height="12" fill="#dae8fc" stroke="#6c8ebf"/><text x="18" y="10" class="seg-label">固定开销（工具+系统提示词+memory）</text>
    <rect x="240" y="0" width="14" height="12" fill="#fff2cc" stroke="#d6b656"/><text x="258" y="10" class="seg-label">Skill 元数据（常驻）</text>
    <rect x="400" y="0" width="14" height="12" fill="#ffe0b3" stroke="#d79b00"/><text x="418" y="10" class="seg-label">被触发的 Skill 正文</text>
    <rect x="540" y="0" width="14" height="12" fill="#e0e0e0" stroke="#999"/><text x="558" y="10" class="seg-label">对话</text>
    <rect x="600" y="0" width="14" height="12" fill="#d5e8d4" stroke="#82b366"/><text x="618" y="10" class="seg-label">空闲</text>
  </g>

  <!-- row 1: lean -->
  <text x="220" y="107" text-anchor="end" class="row-label">精简</text>
  <text x="220" y="123" text-anchor="end" class="row-sub">装 30 个 skill · 不触发大 skill</text>

  <g transform="translate(230, 92)">
    <rect x="0" y="0" width="298" height="40" fill="#dae8fc" stroke="#6c8ebf"/>
    <rect x="298" y="0" width="8" height="40" fill="#fff2cc" stroke="#d6b656"/>
    <rect x="306" y="0" width="74" height="40" fill="#e0e0e0" stroke="#999"/>
    <rect x="380" y="0" width="420" height="40" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="0" y="0" width="800" height="40" fill="none" stroke="#333" stroke-width="1"/>
    <text x="149" y="24" text-anchor="middle" class="seg-in">固定开销 ~74k</text>
  </g>
  <text x="1040" y="117" class="summary">空闲 105k · 52%</text>

  <!-- row 2: bloated -->
  <text x="220" y="197" text-anchor="end" class="row-label">臃肿</text>
  <text x="220" y="213" text-anchor="end" class="row-sub">堆几百 skill + 触发端到端大 skill</text>

  <g transform="translate(230, 182)">
    <rect x="0" y="0" width="298" height="40" fill="#dae8fc" stroke="#6c8ebf"/>
    <rect x="298" y="0" width="32" height="40" fill="#fff2cc" stroke="#d6b656"/>
    <rect x="330" y="0" width="320" height="40" fill="#ffe0b3" stroke="#d79b00" stroke-width="1.5"/>
    <rect x="650" y="0" width="40" height="40" fill="#e0e0e0" stroke="#999"/>
    <rect x="690" y="0" width="110" height="40" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="0" y="0" width="800" height="40" fill="none" stroke="#333" stroke-width="1"/>
    <text x="149" y="24" text-anchor="middle" class="seg-in">固定开销 ~74k</text>
    <text x="490" y="24" text-anchor="middle" class="seg-hi">触发大 skill + 22 子 skill ≈ 40% 窗口</text>
  </g>
  <text x="1040" y="207" class="summary">空闲 ~28k · 14%</text>
</svg>
