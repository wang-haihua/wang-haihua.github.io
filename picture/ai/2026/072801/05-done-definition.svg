<svg viewBox="0 0 840 428" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #222; }
    .card-t { font-size: 16px; font-weight: 700; fill: #1f1c1a; }
    .card-d { font-size: 12.5px; fill: #444; }
    .badge-n { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .verify-t { font-size: 16px; font-weight: 700; fill: #8b4513; }
    .verify-s { font-size: 13px; font-weight: 600; fill: #b85450; }
  </style>

  <rect x="0" y="0" width="840" height="428" fill="#ffffff"/>

  <!-- title -->
  <text x="420" y="46" text-anchor="middle" class="title">一个好 Prompt 的四个要素</text>

  <!-- card 1: Goal (blue) -->
  <g transform="translate(40,78)">
    <rect x="0" y="0" width="370" height="96" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/>
    <circle cx="38" cy="36" r="15" fill="#6c8ebf"/>
    <text x="38" y="41" text-anchor="middle" class="badge-n">1</text>
    <text x="68" y="42" class="card-t">想要什么 · 结果</text>
    <text x="24" y="76" class="card-d">AI 交出的成品长什么样——先把它说清楚</text>
  </g>

  <!-- card 2: Context (green) -->
  <g transform="translate(430,78)">
    <rect x="0" y="0" width="370" height="96" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/>
    <circle cx="38" cy="36" r="15" fill="#82b366"/>
    <text x="38" y="41" text-anchor="middle" class="badge-n">2</text>
    <text x="68" y="42" class="card-t">相关背景 · 上下文</text>
    <text x="24" y="76" class="card-d">需要哪些信息、资料、来源才能做对</text>
  </g>

  <!-- card 3: Done when (yellow) -->
  <g transform="translate(40,190)">
    <rect x="0" y="0" width="370" height="96" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
    <circle cx="38" cy="36" r="15" fill="#d6b656"/>
    <text x="38" y="41" text-anchor="middle" class="badge-n">3</text>
    <text x="68" y="42" class="card-t">完成态 · 什么算做完</text>
    <text x="24" y="76" class="card-d">什么信号告诉你可以停手——不是「差不多」</text>
  </g>

  <!-- card 4: Boundaries (red) -->
  <g transform="translate(430,190)">
    <rect x="0" y="0" width="370" height="96" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="38" cy="36" r="15" fill="#b85450"/>
    <text x="38" y="41" text-anchor="middle" class="badge-n">4</text>
    <text x="68" y="42" class="card-t">边界 · 不做的事</text>
    <text x="24" y="76" class="card-d">哪些手不能伸、哪些别自作主张改</text>
  </g>

  <!-- verify bar: the +1 (orange highlight) -->
  <g transform="translate(40,314)">
    <rect x="0" y="0" width="760" height="72" rx="6" fill="#ffe0b3" stroke="#d79b00" stroke-width="1.5"/>
    <text x="30" y="44" class="verify-t">＋ 一个可验收的检查</text>
    <text x="730" y="44" text-anchor="end" class="verify-s">能跑的命令 / 能核对的数字</text>
  </g>
</svg>
