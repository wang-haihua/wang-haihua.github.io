<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrLight" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa5b1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <!-- ===================== Section A: Model + Harness = Agent ===================== -->
  <g>
    <rect x="255" y="30" width="190" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="350" y="68" text-anchor="middle" font-size="17" font-weight="700" fill="#2c4a6b">Model</text>
    <text x="350" y="90" text-anchor="middle" font-size="12" fill="#5b7ca3">推理 · 决策</text>
    <text x="350" y="106" text-anchor="middle" font-size="11" fill="#5b7ca3">(大脑)</text>

    <text x="465" y="83" text-anchor="middle" font-size="28" font-weight="700" fill="#999">+</text>

    <rect x="485" y="30" width="230" height="90" rx="10" fill="#ffe0b3" stroke="#d79b00" stroke-width="1.5"/>
    <text x="600" y="68" text-anchor="middle" font-size="17" font-weight="700" fill="#8b4513">Harness</text>
    <text x="600" y="90" text-anchor="middle" font-size="12" fill="#8b4513">执行 · 记忆 · 护栏</text>
    <text x="600" y="106" text-anchor="middle" font-size="11" fill="#8b4513">(身体)</text>

    <text x="735" y="83" text-anchor="middle" font-size="28" font-weight="700" fill="#999">=</text>

    <rect x="755" y="30" width="190" height="90" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
    <text x="850" y="68" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5233">Agent</text>
    <text x="850" y="90" text-anchor="middle" font-size="12" fill="#4f7a55">能行动 · 能观察</text>
    <text x="850" y="106" text-anchor="middle" font-size="11" fill="#4f7a55">能调整</text>
  </g>

  <line x1="80" y1="150" x2="1120" y2="150" stroke="#e2e2e2" stroke-width="1"/>

  <!-- ===================== Section title ===================== -->
  <text x="600" y="185" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Harness 内部：九个组件如何围着一个循环运转</text>
  <text x="600" y="206" text-anchor="middle" font-size="12" fill="#8a94a6">两份互不参考的清单，独立收敛到几乎同一张图</text>

  <!-- ===================== System Prompt Assembly ===================== -->
  <rect x="430" y="225" width="340" height="64" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="600" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#2c4a6b">System Prompt Assembly</text>
  <text x="600" y="270" text-anchor="middle" font-size="11" fill="#5b7ca3">CLAUDE.md / AGENTS.md + git 状态 + 工具清单 + 权限</text>

  <line x1="600" y1="289" x2="600" y2="317" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===================== Iteration Loop core ===================== -->
  <rect x="400" y="320" width="400" height="110" rx="12" fill="#ffe0b3" stroke="#d79b00" stroke-width="2"/>
  <text x="600" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#8b4513">Iteration Loop — while (true)</text>
  <text x="600" y="382" text-anchor="middle" font-size="12.5" fill="#8b4513">Reason → Act → Observe → Repeat</text>
  <text x="600" y="401" text-anchor="middle" font-size="11" fill="#8b4513">machine-paced，受最大迭代次数限制</text>

  <!-- fan-out arrows to satellites -->
  <line x1="440" y1="430" x2="170" y2="478" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrLight)"/>
  <line x1="510" y1="430" x2="385" y2="478" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrLight)"/>
  <line x1="600" y1="430" x2="600" y2="478" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrLight)"/>
  <line x1="690" y1="430" x2="815" y2="478" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrLight)"/>
  <line x1="760" y1="430" x2="1030" y2="478" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrLight)"/>

  <!-- ===================== 5 satellites ===================== -->
  <!-- 1 Tools & Skills -->
  <rect x="70" y="480" width="200" height="100" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="170" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5233">Tools &amp; Skills</text>
  <text x="170" y="536" text-anchor="middle" font-size="12" fill="#3f6b46">工具与技能注册表</text>
  <text x="170" y="554" text-anchor="middle" font-size="10" fill="#5c8462">读写 · shell · 搜索</text>

  <!-- 2 Sandbox & FS -->
  <rect x="285" y="480" width="200" height="100" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="385" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5233">Sandbox &amp; FS</text>
  <text x="385" y="536" text-anchor="middle" font-size="12" fill="#3f6b46">沙箱与文件系统</text>
  <text x="385" y="554" text-anchor="middle" font-size="10" fill="#5c8462">隔离执行环境 · 持久化</text>

  <!-- 3 Context Management -->
  <rect x="500" y="480" width="200" height="100" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="600" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5233">Context Mgmt</text>
  <text x="600" y="536" text-anchor="middle" font-size="12" fill="#3f6b46">上下文管理与压缩</text>
  <text x="600" y="554" text-anchor="middle" font-size="10" fill="#5c8462">自动摘要 · token 预算</text>

  <!-- 4 Subagents -->
  <rect x="715" y="480" width="200" height="100" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="815" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5233">Subagents</text>
  <text x="815" y="536" text-anchor="middle" font-size="12" fill="#3f6b46">子智能体隔离</text>
  <text x="815" y="554" text-anchor="middle" font-size="10" fill="#5c8462">并行 · 不污染父上下文</text>

  <!-- 5 Permission & Hooks -->
  <rect x="930" y="480" width="200" height="100" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="1030" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5233">Permission &amp; Hooks</text>
  <text x="1030" y="536" text-anchor="middle" font-size="12" fill="#3f6b46">权限护栏与生命周期钩子</text>
  <text x="1030" y="554" text-anchor="middle" font-size="10" fill="#5c8462">只读/可写/完全权限</text>

  <!-- ===================== down to persistence ===================== -->
  <line x1="600" y1="580" x2="600" y2="648" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="618" y="618" font-size="10.5" fill="#777">每一步都被记录</text>

  <!-- ===================== Persistence & Observability ===================== -->
  <rect x="350" y="650" width="500" height="80" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="600" y="676" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6b5900">Session Persistence (JSONL)</text>
  <text x="600" y="697" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6b5900">→ Observability &amp; Logging</text>
  <text x="600" y="716" text-anchor="middle" font-size="11" fill="#8a7a33">append-only 日志：可 resume / fork / replay，日志即审计</text>

  <!-- ===================== Conclusion ===================== -->
  <rect x="200" y="755" width="800" height="55" rx="8" fill="#f4f8ef" stroke="#82b366" stroke-width="1.3"/>
  <text x="600" y="778" text-anchor="middle" font-size="13" fill="#333">这九个部件不是愿望清单——是不同团队各自独立收敛到的同一套答案</text>
  <text x="600" y="797" text-anchor="middle" font-size="11" fill="#666">DeepSeek Harness 的「插件」与 Arize 的「组件」，指向的是同一张骨架图</text>
</svg>
